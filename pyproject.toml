[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gas-and-energy-mechanics-copilot"
version = "2.0.0"
description = "Multi-agent plan-execute-verify RAG over US federal pipeline-safety regulations, enforcement actions, and accident reports. Research-engineering showcase."
readme = "README.md"
requires-python = ">=3.11,<3.14"

# --- Runtime dependencies (what the Streamlit app + agent graph need at query time) ---
# Kept deliberately lean for the Streamlit Community Cloud 1 GB RAM ceiling: no local
# ML models, no ingestion/eval heavyweights. The reranker is remote (Bedrock).
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.1",
  "boto3>=1.35.0",            # Bedrock runtime + bedrock-agent-runtime (Rerank API)
  "tenacity>=8.3",           # retry/backoff for Bedrock calls
  "numpy>=1.26",             # MMR, vector math
  "psycopg[binary]>=3.2",    # Supabase Postgres (raw SQL for pgvector cosine)
  "pgvector>=0.3.6",         # psycopg vector adapter
  "rank-bm25>=0.2.2",        # in-memory sparse retrieval (~20 MB at this corpus size)
  "langgraph>=0.2.60",       # 3-node state machine
  "langchain-core>=0.3.30",
  "langchain-aws>=0.2.10",   # ChatBedrockConverse (handles inference-profile IDs)
  "langsmith>=0.1.140",      # tracing (env-gated)
  "streamlit>=1.40",
]

# --- Optional groups: NOT installed on Streamlit Cloud; used by build_index / eval / tests ---
[dependency-groups]
ingestion = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pdfplumber>=0.11",
]
eval = [
  "ragas>=0.2.6",
  "datasets>=2.20",
]
dev = [
  "pytest>=8.2",
  "pytest-mock>=3.14",
  "ruff>=0.6",
  "mypy>=1.11",
  {include-group = "ingestion"},
  {include-group = "eval"},
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "scripts", "app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["src"]

[tool.mypy]
files = "src/"
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
